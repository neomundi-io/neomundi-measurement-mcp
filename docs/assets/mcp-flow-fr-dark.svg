<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="220" viewBox="0 0 1080 220" role="img" aria-labelledby="title desc"><title id="title">DONNER ACCÈS AUX MESURES DEPUIS UN AGENT</title><desc id="desc">Le connecteur MCP expose la mesure, sans autorité d'exécution.</desc><rect width="1080" height="220" rx="14" fill="#101827"/><text x="540" y="31" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#f8fafc">DONNER ACCÈS AUX MESURES DEPUIS UN AGENT</text><text x="540" y="54" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#b8c4d6">Le connecteur MCP expose la mesure, sans autorité d'exécution.</text><rect x="18" y="78" width="232" height="112" rx="10" fill="#1b293f" stroke="#64748b" stroke-width="2"/><rect x="18" y="78" width="232" height="6" rx="3" fill="#64748b"/><text x="134" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#64748b">AGENT</text><text x="134" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#f8fafc">Réponse existante</text><text x="134" y="164" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#b8c4d6">ou génération</text><path d="M258 134 h20 m-8 -6 l8 6 l-8 6" stroke="#798ba2" stroke-width="2" fill="none"/><rect x="288" y="78" width="232" height="112" rx="10" fill="#1b293f" stroke="#2563eb" stroke-width="2"/><rect x="288" y="78" width="232" height="6" rx="3" fill="#2563eb"/><text x="404" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#2563eb">MCP</text><text x="404" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#f8fafc">Outil local / HTTP</text><text x="404" y="164" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#b8c4d6">valider la réponse</text><path d="M528 134 h20 m-8 -6 l8 6 l-8 6" stroke="#798ba2" stroke-width="2" fill="none"/><rect x="558" y="78" width="232" height="112" rx="10" fill="#1b293f" stroke="#0f766e" stroke-width="2"/><rect x="558" y="78" width="232" height="6" rx="3" fill="#0f766e"/><text x="674" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f766e">API</text><text x="674" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#f8fafc">REST ou SSE</text><text x="674" y="164" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#b8c4d6">mesurer l'exécution</text><path d="M798 134 h20 m-8 -6 l8 6 l-8 6" stroke="#798ba2" stroke-width="2" fill="none"/><rect x="828" y="78" width="232" height="112" rx="10" fill="#1b293f" stroke="#d29d34" stroke-width="2"/><rect x="828" y="78" width="232" height="6" rx="3" fill="#d29d34"/><text x="944" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#d29d34">RÉSULTAT</text><text x="944" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#f8fafc">Signaux + provenance</text><text x="944" y="164" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#b8c4d6">partiel explicite</text></svg>
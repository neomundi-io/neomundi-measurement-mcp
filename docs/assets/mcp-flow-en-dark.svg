<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="220" viewBox="0 0 1080 220" role="img" aria-labelledby="title desc"><title id="title">AGENT ACCESS TO MEASURABLE OBSERVATIONS</title><desc id="desc">The MCP connector gives agents a measurement interface, not execution authority.</desc><rect width="1080" height="220" rx="14" fill="#101827"/><text x="540" y="31" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#f8fafc">AGENT ACCESS TO MEASURABLE OBSERVATIONS</text><text x="540" y="54" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#b8c4d6">The MCP connector gives agents a measurement interface, not execution authority.</text><rect x="18" y="78" width="232" height="112" rx="10" fill="#1b293f" stroke="#64748b" stroke-width="2"/><rect x="18" y="78" width="232" height="6" rx="3" fill="#64748b"/><text x="134" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#64748b">AGENT</text><text x="134" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#f8fafc">Existing answer</text><text x="134" y="164" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#b8c4d6">or generation request</text><path d="M258 134 h20 m-8 -6 l8 6 l-8 6" stroke="#798ba2" stroke-width="2" fill="none"/><rect x="288" y="78" width="232" height="112" rx="10" fill="#1b293f" stroke="#2563eb" stroke-width="2"/><rect x="288" y="78" width="232" height="6" rx="3" fill="#2563eb"/><text x="404" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#2563eb">MCP</text><text x="404" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#f8fafc">Local / HTTP tool</text><text x="404" y="164" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#b8c4d6">validate response</text><path d="M528 134 h20 m-8 -6 l8 6 l-8 6" stroke="#798ba2" stroke-width="2" fill="none"/><rect x="558" y="78" width="232" height="112" rx="10" fill="#1b293f" stroke="#0f766e" stroke-width="2"/><rect x="558" y="78" width="232" height="6" rx="3" fill="#0f766e"/><text x="674" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f766e">API</text><text x="674" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#f8fafc">REST or SSE</text><text x="674" y="164" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#b8c4d6">measure execution</text><path d="M798 134 h20 m-8 -6 l8 6 l-8 6" stroke="#798ba2" stroke-width="2" fill="none"/><rect x="828" y="78" width="232" height="112" rx="10" fill="#1b293f" stroke="#d29d34" stroke-width="2"/><rect x="828" y="78" width="232" height="6" rx="3" fill="#d29d34"/><text x="944" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#d29d34">RESULT</text><text x="944" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#f8fafc">Signals + provenance</text><text x="944" y="164" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#b8c4d6">partial stays explicit</text></svg>
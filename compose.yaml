# Local run of the NeoMundi measurement MCP connector.
#
#   NEOMUNDI_API_KEY=... NEOMUNDI_MCP_API_KEY=... docker compose up --build
#
# Both credentials come from the shell that runs this file. They are NOT
# written here, and no `env_file` is declared: the server reads no .env, and a
# compose file committed to a repository is the wrong place for a secret.
#
# Nothing is pushed. No image name points at a registry.
services:
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: neomundi-measurement-mcp:local
    # One-to-one, and bound to the host's loopback interface only. The left
    # side keeps the connector unreachable from the network even though the
    # listener inside the container is wider; the matching port numbers keep
    # the forwarded Host header inside the server's allow-list.
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      # Required. Absent or malformed, the server refuses to start.
      NEOMUNDI_API_KEY: ${NEOMUNDI_API_KEY:?NEOMUNDI_API_KEY must be set in the environment}
      NEOMUNDI_MCP_API_KEY: ${NEOMUNDI_MCP_API_KEY:?NEOMUNDI_MCP_API_KEY must be set in the environment}
      # Optional. Only needed for the generation path, which calls a provider
      # and bills it. Left unset, that path refuses with a stated reason
      # instead of attempting anything.
      NEOMUNDI_PROVIDER_API_KEY: ${NEOMUNDI_PROVIDER_API_KEY:-}
      # Optional. Defaults to https://api.neomundi.io. Plain HTTP is accepted
      # only for a loopback host, which from inside a container means the
      # container's own loopback — not the host machine's.
      NEOMUNDI_API_BASE_URL: ${NEOMUNDI_API_BASE_URL:-https://api.neomundi.io}
      # OAuth 2.1. All three go together or none does; a partial setting is
      # refused at startup. Left unset — which is the default here — the
      # server behaves exactly as it did before OAuth existed.
      #
      # NEOMUNDI_API_KEY above is the TECHNICAL credential that calls the
      # instrument. The identities below are the people asking for a
      # measurement. Two different secrets, two different lifetimes; the
      # server never blends them and neither should an operator.
      NEOMUNDI_MCP_PUBLIC_URL: ${NEOMUNDI_MCP_PUBLIC_URL:-}
      NEOMUNDI_OAUTH_SIGNING_KEY: ${NEOMUNDI_OAUTH_SIGNING_KEY:-}
      NEOMUNDI_OAUTH_REGISTRY: ${NEOMUNDI_OAUTH_REGISTRY:-}
      NEOMUNDI_OAUTH_ACCESS_TTL_S: ${NEOMUNDI_OAUTH_ACCESS_TTL_S:-}
      NEOMUNDI_OAUTH_REFRESH_TTL_S: ${NEOMUNDI_OAUTH_REFRESH_TTL_S:-}
      # Unset means nothing about anyone is held between two requests.
      NEOMUNDI_OAUTH_QUOTA_PER_SUBJECT: ${NEOMUNDI_OAUTH_QUOTA_PER_SUBJECT:-}
      NEOMUNDI_MCP_ALLOWED_HOSTS: ${NEOMUNDI_MCP_ALLOWED_HOSTS:-}
      NEOMUNDI_MCP_BIND: ${NEOMUNDI_MCP_BIND:-}
    # The participant registry, mounted READ-ONLY. The server never writes it,
    # the container filesystem is read-only anyway, and mounting a file rather
    # than a directory avoids the ownership surprise a fresh named volume
    # brings when the image has no such path.
    #
    # It is a file of identities and scrypt hashes — no secret, nothing
    # reversible — but it is still the thing that decides who gets in, so it
    # is bind-mounted from a path the operator controls rather than baked into
    # the image.
    #
    # Left commented because the default here is OAuth off. Uncomment it, and
    # only it, when the three variables above are set:
    #
    # volumes:
    #   - /etc/neomundi/participants.json:/etc/neomundi/participants.json:ro
    #
    # Bind-mount the FILE, not its directory, and keep `:ro`. A named volume
    # on a path the image does not create comes back owned by root and the
    # failure surfaces as a PermissionError that nothing in Compose shows.
    # `docker compose stop` sends SIGTERM, which the server handles. The grace
    # period is longer than the default 10s because a measurement call in
    # flight is not retried: cutting it short leaves an outcome unknown, and
    # the connector cannot ask NeoMundi whether the call was billed.
    stop_grace_period: 45s
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
